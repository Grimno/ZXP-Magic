name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # the updater key is passwordless (rotated 2026-07): Tauri v2 still asks for a password
          # when this is unset - and there is nobody to answer in CI, so the build stopped there
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ZXP Magic ${{ github.ref_name }}
          releaseBody: |
            ## ZXP Magic ${{ github.ref_name }}

            Adobe CEP extension manager for Windows and macOS.

            ### Downloads
            - **Windows**: `ZXP Magic Setup.exe`
            - **macOS (Intel)**: `ZXP Magic_x64.dmg`
            - **macOS (Apple Silicon)**: `ZXP Magic_aarch64.dmg`

            > **macOS note:** If macOS says the app is damaged, right-click the .dmg → Open, then drag to Applications. If needed, run: `xattr -cr "/Applications/ZXP Magic.app"`
          # draft first: checked, then published by hand (the site serves releases/latest)
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
